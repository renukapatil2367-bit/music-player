
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melody - Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="player">
    <header class="topbar">
      <h2>🎵 Melody</h2>
      <span class="tag">MUSIC PLAYER</span>
    </header>

    <section class="album">
      <div class="cover" id="cover">🎧</div>
      <p class="eyebrow">NOW PLAYING</p>
      <h1 id="title">Dreamy Nights</h1>
      <p id="artist">Melody Artist</p>
    </section>

    <audio id="audio"></audio>

    <section class="timeline">
      <input type="range" id="progress"
        min="0" max="100" value="0"
        aria-label="Song progress">

      <div class="time">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </section>

    <section class="controls">
      <button id="prev" aria-label="Previous song">⏮</button>
      <button id="play" class="play-btn"
        aria-label="Play song">▶</button>
      <button id="next" aria-label="Next song">⏭</button>
    </section>

    <section class="volume">
      <span>🔈</span>
      <input type="range" id="volume"
        min="0" max="1" step="0.01" value="0.7"
        aria-label="Volume">
      <span>🔊</span>
    </section>

    <section class="playlist-section">
      <div class="playlist-heading">
        <h3>Your Playlist</h3>
        <label class="autoplay">
          <input type="checkbox" id="autoplay" checked>
          Autoplay
        </label>
      </div>
      <ul id="playlist"></ul>
    </section>

    <p id="status" class="status">Ready to play</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
